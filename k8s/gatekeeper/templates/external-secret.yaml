{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "secret.name is required" .Values.secret.name | quote }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.storeName is required" .Values.externalSecret.storeName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ required "secret.name is required" .Values.secret.name | quote }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecret.remoteKey is required" .Values.externalSecret.remoteKey | quote }}
{{- end }}
